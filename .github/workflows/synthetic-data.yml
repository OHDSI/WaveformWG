# Rebuilds the synthetic QTc dataset and checks the tutorial against its answer key.
name: Synthetic data checks

on:
  pull_request:
    paths:
      - 'syntheticData/qtc/**'
      - '.github/benchmark/check_qtc.py'
      - '.github/workflows/synthetic-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  qtc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: syntheticData/qtc/requirements.txt

      - name: Install Python packages
        run: pip install -r syntheticData/qtc/requirements.txt

      - name: Rebuild the dataset (simulate, ETL, features, estimates)
        run: syntheticData/qtc/build.sh

      - name: Check the dataset and tutorial against the answer key
        run: python3 .github/benchmark/check_qtc.py

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true

      - name: Exercise 4, R track
        run: cd syntheticData/qtc && Rscript tutorial/solutions/ex4_effect_estimation.R

      - name: Upload the rebuilt figures
        uses: actions/upload-artifact@v4
        with:
          name: qtc-figures
          path: rmd/images/qtc-*.png
